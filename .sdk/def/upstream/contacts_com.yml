  version: 1.0.0
  title: "SMSAPI REST API \u2013 Contacts"
  description: |-
    [SMSAPI.com main page](https://www.smsapi.com/)

    [API documentation](https://www.smsapi.com/docs)
    ### URL adresses
    API URL adresses:
    * `https://api.smsapi.com/` - for secure SSL connections
    * `https://api2.smsapi.com/` - backup for secure SSL connections

    ### Authentication
    Authentication at SMSAPI utilizes OAuth 2 mechanism. You can generate OAuth token in our customer panel [API Tokens](https://ssl.smsapi.com/react/oauth/manage). Authentication header will be necessary in request to our API.

    `Authorization: Bearer <token>`
